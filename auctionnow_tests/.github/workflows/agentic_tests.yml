name: Agentic Test Generator

on:
  pull_request:
    types: [opened, synchronize]
    branches: [dev, stage]

permissions:
  contents: read
  pull-requests: write    # needed to post PR comments

jobs:
  generate-tests:
    name: Generate edge-case tests for new endpoints
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install openai httpx PyGithub python-dotenv

      - name: Run agentic test generator
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python .github/scripts/agentic_test_generator.py

